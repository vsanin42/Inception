services:

  nginx:
    image: nginx
    build: ./requirements/nginx
    container_name: nginx
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wp-volume:/var/www/html
    ports:
      - "443:443"
    networks:
      - inception
    pull_policy: never
    restart: unless-stopped

  wordpress:
    image: wordpress
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - path: ./.env
        required: true
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wp-volume:/var/www/html
    networks:
      - inception
    pull_policy: never
    restart: unless-stopped

  mariadb:
    image: mariadb
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - path: ./.env
        required: true
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - inception
    pull_policy: never
    restart: unless-stopped

volumes:
  db-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vsanin/data/db-volume
  wp-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vsanin/data/wp-volume

networks:
  inception:
    name: inception
    driver: bridge